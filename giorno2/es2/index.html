<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {background-color: rgb(74, 64, 79);margin-left: 2em;}
		.sfondo {
    background-image: "lettrere_legno.jpg";
    background-size: cover;
    background-position: center;
    position: fixed;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    opacity: 0.05;}
    </style>
</head>
<body>
      <div class="sfondo"><img src="img/lettrere_legno.jpg" alt=""></div>
	<br>
    <a href="https://nicomigna.github.io/ilmiosito-nm/"><img src="img/-nm.svg"; width="200px"; margin-left: 20px;></a>
	<br><br>
<p style="font-family: 'Courier New', Courier, monospace; color: whitesmoke;">This is me (:</p>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>

    <script>

    let face

		function preload() {
			face = loadImage('img/Profilo.png')
		}

		function setup() {
			let cnv = createCanvas(windowWidth, windowHeight)
			cnv.position(0, 0)
			cnv.style('z-index', '-1')
			face.resize(face.width / 7 * 1.1, face.height / 7 * 1.1)
		}

		function draw(){
			clear()
			noStroke()

			let numH = face.width
			let numV = face.height
			let d = 8
			let ox = (width - (numH - 1) * d) / 2
			let oy = (height - (numV - 1) * d) / 2

			let amount = mouseX * 0.3

			let ny = frameCount * 0.011
			let nx = frameCount * 0.031
			let nz = frameCount * 0.014

			for (let j=0; j<numV; j++) {
				for(let i=0; i<numH; i++) {
					let col = face.get(i, j)
					let al = alpha(col)
					if (al < 250) continue
					let br = brightness(col)
					fill(col[0] + 50, col[1] + 50, col[2] + 50, col[3])
					let px = ox + i * d + map(noise( i * 0.02 + nx, j * 0.02 + ny, nz), 0, 1, -amount, amount)
					let py = oy + j * d + map(noise( i * 0.02 + nx, j * 0.02 + ny, nz + 5), 0, 1, -amount, amount)
					circle(px, py, br * 0.06)
				}
			}


		}

		function windowResized() {
			resizeCanvas(windowWidth, windowHeight)
		}
	</script>
</body>
</html>
